name: Stage A secure JS shape check

on:
  push:
    branches:
      - research/stage-a-public-js
    paths:
      - .github/workflows/stage-a-secure-shape-once.yml

permissions:
  contents: read

jobs:
  public-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all offline Stage A tests
        run: python -m unittest discover -s tests -p 'test_stage_a*.py' -v
      - name: Classify argument structure without extracting decoder values
        run: python research/stage_a_secure_shape_probe.py --url 'https://comix.ws/title/rrglg-the-great-journey-of-teenagers-folly-of-youths-arc'
