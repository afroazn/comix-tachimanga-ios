name: Comix public key origin research
on:
  push:
    branches:
      - research/comix-key-origin
    paths:
      - .github/workflows/comix-key-origin-once.yml

permissions:
  contents: read

jobs:
  analyze-public-js:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        run: python -m unittest discover -s tests -p 'test_stage_a*.py' -v
      - name: Inspect public Javascript references without executing
        run: python research/inspect_public_key_origin.py
